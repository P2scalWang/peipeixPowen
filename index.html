<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองคิวทำผม - Hair Salon Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2C1810;
            --secondary: #D4A574;
            --accent: #E8C4A0;
            --bg: #FFF8F3;
            --text: #1a1a1a;
            --border: #E5D5C8;
            --shadow: rgba(44, 24, 16, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #FFF5ED 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(212, 165, 116, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: float 20s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            left: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(232, 196, 160, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: float 15s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(5deg); }
            66% { transform: translate(-20px, 20px) rotate(-5deg); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: -2px;
            text-shadow: 2px 2px 0px var(--accent);
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--secondary);
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px;
            border: 2px solid var(--border);
            box-shadow: 0 10px 40px var(--shadow);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(44, 24, 16, 0.15);
            border-color: var(--secondary);
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-title::before {
            content: '';
            width: 6px;
            height: 30px;
            background: linear-gradient(to bottom, var(--secondary), var(--accent));
            border-radius: 3px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary);
            font-size: 0.95rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-family: 'Kanit', sans-serif;
            font-size: 1rem;
            background: white;
            transition: all 0.3s ease;
            color: var(--text);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 4px rgba(212, 165, 116, 0.1);
            transform: translateY(-2px);
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .service-item {
            position: relative;
        }

        .service-item input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .service-label {
            display: block;
            padding: 16px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .service-item input[type="checkbox"]:checked + .service-label {
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            color: white;
            border-color: var(--secondary);
            transform: scale(1.05);
        }

        .service-label:hover {
            border-color: var(--secondary);
            transform: translateY(-2px);
        }

        .price {
            display: block;
            font-size: 0.85rem;
            margin-top: 4px;
            opacity: 0.8;
        }

        .stylist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .stylist-card {
            position: relative;
            text-align: center;
            cursor: pointer;
        }

        .stylist-card input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .stylist-content {
            padding: 20px 15px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .stylist-card input[type="radio"]:checked + .stylist-content {
            background: linear-gradient(135deg, var(--primary), #3d2417);
            color: white;
            border-color: var(--primary);
            transform: scale(1.08);
        }

        .stylist-content:hover {
            border-color: var(--secondary);
            transform: translateY(-4px);
        }

        .stylist-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .stylist-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .booking-form {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 248, 243, 0.95));
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), #3d2417);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            font-family: 'Kanit', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(44, 24, 16, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-submit:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(44, 24, 16, 0.4);
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .time-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .time-slot {
            position: relative;
        }

        .time-slot input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .time-label {
            display: block;
            padding: 12px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .time-slot input[type="radio"]:checked + .time-label {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
            transform: scale(1.05);
        }

        .time-label:hover {
            border-color: var(--secondary);
            transform: translateY(-2px);
        }

        .summary-box {
            background: linear-gradient(135deg, #f8f4ef, #fff);
            padding: 25px;
            border-radius: 16px;
            margin-top: 30px;
            border: 2px solid var(--accent);
            display: none;
        }

        .summary-box.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .summary-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .summary-item:last-child {
            border-bottom: none;
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--secondary);
            margin-top: 10px;
            padding-top: 15px;
            border-top: 2px solid var(--secondary);
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .service-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 3rem;
            }

            .card {
                padding: 25px;
            }
        }

        .success-message {
            display: none;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-top: 20px;
            animation: bounceIn 0.6s ease-out;
        }

        .success-message.active {
            display: block;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            50% {
                transform: scale(1.05);
            }
            70% {
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid var(--border);
            border-top: 4px solid var(--secondary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HAIR SALON</h1>
            <p class="tagline">จองคิวออนไลน์</p>
        </header>

        <div class="main-grid">
            <!-- บริการ -->
            <div class="card">
                <h2 class="card-title">เลือกบริการ</h2>
                <div class="service-grid">
                    <div class="service-item">
                        <input type="checkbox" id="service1" name="service" value="ตัดผม,250" onchange="updateSummary()">
                        <label for="service1" class="service-label">
                            ✂️ ตัดผม
                            <span class="price">250 บาท</span>
                        </label>
                    </div>
                    <div class="service-item">
                        <input type="checkbox" id="service2" name="service" value="สระผม,150" onchange="updateSummary()">
                        <label for="service2" class="service-label">
                            🚿 สระผม
                            <span class="price">150 บาท</span>
                        </label>
                    </div>
                    <div class="service-item">
                        <input type="checkbox" id="service3" name="service" value="ย้อมสี,1200" onchange="updateSummary()">
                        <label for="service3" class="service-label">
                            🎨 ย้อมสี
                            <span class="price">1,200 บาท</span>
                        </label>
                    </div>
                    <div class="service-item">
                        <input type="checkbox" id="service4" name="service" value="ดัดผม,1500" onchange="updateSummary()">
                        <label for="service4" class="service-label">
                            💇 ดัดผม
                            <span class="price">1,500 บาท</span>
                        </label>
                    </div>
                    <div class="service-item">
                        <input type="checkbox" id="service5" name="service" value="ยืดผม,1800" onchange="updateSummary()">
                        <label for="service5" class="service-label">
                            ✨ ยืดผม
                            <span class="price">1,800 บาท</span>
                        </label>
                    </div>
                    <div class="service-item">
                        <input type="checkbox" id="service6" name="service" value="ทรีทเม้นท์,800" onchange="updateSummary()">
                        <label for="service6" class="service-label">
                            💆 ทรีทเม้นท์
                            <span class="price">800 บาท</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- ช่างทำผม -->
            <div class="card">
                <h2 class="card-title">เลือกช่าง</h2>
                <div class="stylist-grid">
                    <div class="stylist-card">
                        <input type="radio" id="stylist1" name="stylist" value="พี่เจ" onchange="updateSummary()">
                        <label for="stylist1" class="stylist-content">
                            <div class="stylist-icon">👨‍🦱</div>
                            <div class="stylist-name">พี่เจ</div>
                        </label>
                    </div>
                    <div class="stylist-card">
                        <input type="radio" id="stylist2" name="stylist" value="พี่มิ้น" onchange="updateSummary()">
                        <label for="stylist2" class="stylist-content">
                            <div class="stylist-icon">👩‍🦰</div>
                            <div class="stylist-name">พี่มิ้น</div>
                        </label>
                    </div>
                    <div class="stylist-card">
                        <input type="radio" id="stylist3" name="stylist" value="พี่แบงค์" onchange="updateSummary()">
                        <label for="stylist3" class="stylist-content">
                            <div class="stylist-icon">👨‍🦲</div>
                            <div class="stylist-name">พี่แบงค์</div>
                        </label>
                    </div>
                    <div class="stylist-card">
                        <input type="radio" id="stylist4" name="stylist" value="พี่นิว" onchange="updateSummary()">
                        <label for="stylist4" class="stylist-content">
                            <div class="stylist-icon">👩‍🦱</div>
                            <div class="stylist-name">พี่นิว</div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- วันและเวลา -->
            <div class="card">
                <h2 class="card-title">วันที่และเวลา</h2>
                <div class="form-group">
                    <label for="date">เลือกวันที่</label>
                    <input type="date" id="date" name="date" required onchange="updateSummary()">
                </div>
                <div class="form-group">
                    <label>เลือกเวลา</label>
                    <div class="time-slots">
                        <div class="time-slot">
                            <input type="radio" id="time1" name="time" value="09:00" onchange="updateSummary()">
                            <label for="time1" class="time-label">09:00</label>
                        </div>
                        <div class="time-slot">
                            <input type="radio" id="time2" name="time" value="10:00" onchange="updateSummary()">
                            <label for="time2" class="time-label">10:00</label>
                        </div>
                        <div class="time-slot">
                            <input type="radio" id="time3" name="time" value="11:00" onchange="updateSummary()">
                            <label for="time3" class="time-label">11:00</label>
                        </div>
                        <div class="time-slot">
                            <input type="radio" id="time4" name="time" value="13:00" onchange="updateSummary()">
                            <label for="time4" class="time-label">13:00</label>
                        </div>
                        <div class="time-slot">
                            <input type="radio" id="time5" name="time" value="14:00" onchange="updateSummary()">
                            <label for="time5" class="time-label">14:00</label>
                        </div>
                        <div class="time-slot">
                            <input type="radio" id="time6" name="time" value="15:00" onchange="updateSummary()">
                            <label for="time6" class="time-label">15:00</label>
                        </div>
                        <div class="time-slot">
                            <input type="radio" id="time7" name="time" value="16:00" onchange="updateSummary()">
                            <label for="time7" class="time-label">16:00</label>
                        </div>
                        <div class="time-slot">
                            <input type="radio" id="time8" name="time" value="17:00" onchange="updateSummary()">
                            <label for="time8" class="time-label">17:00</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ข้อมูลลูกค้า -->
            <div class="card booking-form">
                <h2 class="card-title">ข้อมูลการจอง</h2>
                <form id="bookingForm" onsubmit="submitBooking(event)">
                    <div class="form-group">
                        <label for="name">ชื่อ-นามสกุล *</label>
                        <input type="text" id="name" name="name" required placeholder="กรอกชื่อของคุณ">
                    </div>
                    <div class="form-group">
                        <label for="phone">เบอร์โทรศัพท์ *</label>
                        <input type="tel" id="phone" name="phone" required placeholder="08X-XXX-XXXX">
                    </div>
                    <div class="form-group">
                        <label for="note">หมายเหตุ (ถ้ามี)</label>
                        <textarea id="note" name="note" rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม..."></textarea>
                    </div>

                    <!-- สรุปการจอง -->
                    <div id="summaryBox" class="summary-box">
                        <h3 class="summary-title">📋 สรุปการจอง</h3>
                        <div class="summary-item">
                            <span>บริการ:</span>
                            <span id="summaryServices">-</span>
                        </div>
                        <div class="summary-item">
                            <span>ช่าง:</span>
                            <span id="summaryStylist">-</span>
                        </div>
                        <div class="summary-item">
                            <span>วันที่:</span>
                            <span id="summaryDate">-</span>
                        </div>
                        <div class="summary-item">
                            <span>เวลา:</span>
                            <span id="summaryTime">-</span>
                        </div>
                        <div class="summary-item">
                            <span>💰 ราคารวม:</span>
                            <span id="summaryTotal">0 บาท</span>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        <span style="position: relative; z-index: 1;">ยืนยันการจอง</span>
                    </button>
                </form>

                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 15px; color: var(--secondary);">กำลังประมวลผล...</p>
                </div>

                <div id="successMessage" class="success-message">
                    <h3 style="font-size: 1.5rem; margin-bottom: 10px;">✅ จองสำเร็จ!</h3>
                    <p>ระบบได้รับการจองของคุณแล้ว<br>เราจะส่ง SMS ยืนยันไปที่เบอร์ของคุณในไม่ช้า</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ตั้งค่าวันที่ขั้นต่ำเป็นวันนี้
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);

        function updateSummary() {
            // เก็บข้อมูลบริการที่เลือก
            const services = [];
            let totalPrice = 0;
            document.querySelectorAll('input[name="service"]:checked').forEach(cb => {
                const [name, price] = cb.value.split(',');
                services.push(name);
                totalPrice += parseInt(price);
            });

            // ช่าง
            const stylist = document.querySelector('input[name="stylist"]:checked');
            
            // วันที่
            const date = dateInput.value;
            
            // เวลา
            const time = document.querySelector('input[name="time"]:checked');

            // แสดงผลสรุป
            const summaryBox = document.getElementById('summaryBox');
            if (services.length > 0 || stylist || date || time) {
                summaryBox.classList.add('active');
                
                document.getElementById('summaryServices').textContent = 
                    services.length > 0 ? services.join(', ') : '-';
                
                document.getElementById('summaryStylist').textContent = 
                    stylist ? stylist.value : '-';
                
                document.getElementById('summaryDate').textContent = 
                    date ? new Date(date + 'T00:00:00').toLocaleDateString('th-TH', { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric' 
                    }) : '-';
                
                document.getElementById('summaryTime').textContent = 
                    time ? time.value + ' น.' : '-';
                
                document.getElementById('summaryTotal').textContent = 
                    totalPrice > 0 ? totalPrice.toLocaleString() + ' บาท' : '0 บาท';
            }
        }

        function submitBooking(event) {
            event.preventDefault();
            
            // ตรวจสอบข้อมูล
            const services = document.querySelectorAll('input[name="service"]:checked');
            const stylist = document.querySelector('input[name="stylist"]:checked');
            const date = document.getElementById('date').value;
            const time = document.querySelector('input[name="time"]:checked');
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            if (services.length === 0) {
                alert('กรุณาเลือกบริการอย่างน้อย 1 รายการ');
                return;
            }

            if (!stylist) {
                alert('กรุณาเลือกช่างทำผม');
                return;
            }

            if (!date) {
                alert('กรุณาเลือกวันที่');
                return;
            }

            if (!time) {
                alert('กรุณาเลือกเวลา');
                return;
            }

            // แสดง loading
            const form = document.getElementById('bookingForm');
            const loading = document.getElementById('loading');
            const successMessage = document.getElementById('successMessage');
            
            form.style.display = 'none';
            loading.classList.add('active');

            // จำลองการส่งข้อมูล
            setTimeout(() => {
                loading.classList.remove('active');
                successMessage.classList.add('active');
                
                // รีเซ็ตฟอร์มหลัง 3 วินาที
                setTimeout(() => {
                    successMessage.classList.remove('active');
                    form.style.display = 'block';
                    form.reset();
                    document.getElementById('summaryBox').classList.remove('active');
                }, 3000);
            }, 2000);
        }

        // Auto-update summary on page load if values exist
        window.addEventListener('load', updateSummary);
    </script>
</body>
</html>
